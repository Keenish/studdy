# verify_all.sh 를 다른 기계에서 돌린다.
#
# 목적이 둘이다.
#   1. 가드를 가드로 만든다. 지금까지는 내가 기억할 때만 도는 로컬 습관이었다
#   2. **스냅샷 기계 간 재현성**에 답을 냈다 — 답은 "재현되지 않는다"였다.
#      runner(macOS 26.4 / Xcode 26.5) 에서 6건 전부 실패했고 허용 오차로도
#      안 됐다. 그래서 스냅샷은 로컬 전용 가드로 두고 CI 에서는 제외한다.
#
# 로컬 기준 환경: Apple Swift 6.3.3 · Xcode 26.6 · macOS 26.5.2 · arm64
# runner 가 이와 다르면 그 차이 자체가 관측 대상이다.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # 툴체인을 먼저 찍는다. 실패했을 때 "코드가 틀렸나 환경이 다른가"를
      # 구별하려면 이 출력이 있어야 한다.
      - name: 환경
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version

      # 스냅샷은 제외한다. 참조 이미지가 기록한 기계의 폰트 메트릭에 묶여
      # runner 에서 6건 전부 실패한다 — 허용 오차로도 안 됐다(실측).
      # 이건 회귀가 아니라 **기계 종속**이므로 CI 를 빨갛게 둘 이유가 없다.
      # 대신 건너뛰었다는 사실이 로그에 찍힌다.
      - name: verify_all.sh
        env:
          SKIP_SNAPSHOTS: "1"
        run: bash verify_all.sh
