# verify_all.sh 를 다른 기계에서 돌린다.
#
# 목적이 둘이다.
#   1. 가드를 가드로 만든다. 지금까지는 내가 기억할 때만 도는 로컬 습관이었다
#   2. **스냅샷 기계 간 재현성**에 답을 낸다 — runner 가 곧 다른 기계다.
#      깨지면 그게 답이고(폰트·렌더러 차이), 통과하면 CI 에 걸 수 있다는 증명이다
#
# 로컬 기준 환경: Apple Swift 6.3.3 · Xcode 26.6 · macOS 26.5.2 · arm64
# runner 가 이와 다르면 그 차이 자체가 관측 대상이다.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # 툴체인을 먼저 찍는다. 실패했을 때 "코드가 틀렸나 환경이 다른가"를
      # 구별하려면 이 출력이 있어야 한다.
      - name: 환경
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version

      - name: verify_all.sh
        run: bash verify_all.sh
